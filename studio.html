<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudio 3D Personalizado | 3D Shirt Studio Atelier</title>
  <meta name="description" content="Atelier 3D interactivo para personalizar camisetas streetwear 240 GSM. Estampados DTF en frente y espalda." />

  <!-- Tipografías de Alta Gama -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Hojas de Estilo Modulares -->
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/layout.css" />
  <link rel="stylesheet" href="./src/styles/sidebar.css" />
  <link rel="stylesheet" href="./src/styles/viewer.css" />
  <link rel="stylesheet" href="./src/styles/controls.css" />
  <link rel="stylesheet" href="./src/styles/transform.css" />
  <link rel="stylesheet" href="./src/styles/pricing.css" />
  <link rel="stylesheet" href="./src/styles/modal.css" />
  <link rel="stylesheet" href="./src/styles/toast.css" />
  <link rel="stylesheet" href="./src/styles/imageEditor.css" />
  <link rel="stylesheet" href="./src/styles/loader.css" />
  <link rel="stylesheet" href="./src/styles/authorDesigns.css" />
  <link rel="stylesheet" href="./src/styles/studioFullscreen.css" />
  <link rel="stylesheet" href="./src/styles/sizePanel.css" />
  <link rel="stylesheet" href="./src/styles/polish.css" />
</head>
<body class="theme-obsidian">
  <!-- Contenedor del Cyber Loader -->
  <div id="studio-loader-mount"></div>

  <!-- VISTA DEDICADA A PANTALLA COMPLETA (ATELIER 3D) -->
  <div id="studio-view" class="studio-fullscreen-view" style="display: flex;">
    <header class="studio-app-topbar">
      <div class="topbar-left-group">
        <a href="index.html" class="btn-back-to-store" id="btn-back-to-store" title="Volver a la tienda principal" style="text-decoration: none;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>Volver a la Tienda</span>
        </a>
        <div class="topbar-studio-title" style="display: flex; align-items: center; gap: 8px;">
          <img src="/assets/logo.svg" alt="Logo" style="width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255, 87, 34, 0.4));" />
          <span>SHIRT STUDIO 3D</span>
          <span class="topbar-badge-live"><span class="dot-pulse"></span>ATELIER 3D</span>
        </div>
      </div>
      <div class="topbar-right-group">
        <button type="button" class="btn-orders-history" id="btn-orders-history" title="Ver pedidos guardados">
          <span>📦</span>
          <span>Mis Pedidos</span>
        </button>
        <span class="topbar-tab-indicator">RENDER ACTIVO EN TIEMPO REAL</span>
        <button type="button" class="btn-theme-toggle" id="btn-studio-theme-toggle" title="Cambiar tema claro/oscuro">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <main class="studio-fullscreen-workspace">
      <!-- Visor 3D Interactivo a Pantalla Completa -->
      <section class="viewer-section" id="viewer-section">
        <div class="viewer-canvas-container" id="canvas-container"></div>
        <div class="viewer-top-left-dock">
          <div class="interaction-hint">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            <span>Rotación 360° • Zoom táctil • Órbita esférica</span>
          </div>
          <div id="silhouette-switcher-mount"></div>
        </div>
        <div class="viewport-badge-top-right"><span class="pulse-indicator"></span><span>RENDER EN VIVO</span></div>
        <div id="view-switcher-mount"></div>
      </section>

      <!-- Barra Lateral de Personalización -->
      <aside class="sidebar-section" aria-label="Panel de Personalización">
        <div class="sidebar-header">
          <div class="sidebar-meta"><span class="studio-tag">ESTUDIO 3D</span><span class="meta-separator">•</span><span class="fabric-tag">Heavyweight 240 GSM</span></div>
          <h2 class="sidebar-title">Configuración de Prenda</h2>
        </div>

        <!-- Selector de Zonas (Frente Central, Logo Pecho y Espalda) -->
        <div class="zones-nav-wrapper">
          <nav class="zones-segmented-control" id="zones-tabs">
            <button type="button" class="zone-tab-btn active" data-zone="front"><span class="zone-title">Frente Central</span></button>
            <button type="button" class="zone-tab-btn" data-zone="frontPocket"><span class="zone-title">Logo Pecho</span></button>
            <button type="button" class="zone-tab-btn" data-zone="back"><span class="zone-title">Espalda</span></button>
          </nav>
        </div>

        <div class="sidebar-scroll-body">
          <div id="color-picker-mount"></div>
          <div id="decal-uploader-mount"></div>
          <div id="decal-controls-mount"></div>
        </div>

        <div id="pricing-bar-mount"></div>
      </aside>
    </main>
  </div>

  <script type="module" src="./src/studio.js"></script>
</body>
</html>
